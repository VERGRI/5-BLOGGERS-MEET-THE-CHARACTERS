function key(k){return 'bloggers5_'+k}function getJSON(k,f){try{return JSON.parse(localStorage.getItem(key(k)))??f}catch{return f}}function save(k,v){try{localStorage.setItem(key(k),JSON.stringify(v))}catch{}}
let chosen=getJSON('selected',DATA.map(x=>x.id));chosen=chosen.filter(i=>Number.isInteger(i)&&i>=0&&i<DATA.length);let tab='home', idx=0, turned=false, mode=0, answered=false, answerVal='', selectedMatch=null, matchDone=[], matchList=[], evalState=null;
const TABS=[['home','🏠 Accueil'],['flash','🃏 Flashcards'],['dict','🔊 Dictée'],['write','✏️ Écriture'],['translate','🌍 Traduction FR'],['match','🧩 Appariement'],['eval','🏆 Évaluation']];
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9']/g,' ').replace(/\s+/g,' ').trim()}function good(v,solutions){return solutions.some(s=>normalize(v)===normalize(s))}const active=()=>DATA.filter(x=>chosen.includes(x.id));function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function rand(){return Math.floor(Math.random()*1000000)}
let audioUtterance=null;
let englishVoices=[];
function refreshVoices(){try{englishVoices=window.speechSynthesis.getVoices().filter(v=>/^en([_-]|$)/i.test(v.lang))}catch(e){englishVoices=[]}}
if('speechSynthesis' in window){refreshVoices();window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices)}
function audioMessage(message){let el=document.getElementById('audioMessage');if(!el){el=document.createElement('div');el.id='audioMessage';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.style.cssText='position:fixed;z-index:9999;bottom:14px;left:14px;right:14px;max-width:650px;margin:auto;padding:10px 16px;border-radius:12px;background:#073f53;color:white;box-shadow:0 3px 20px #0003;font-weight:700;text-align:center;display:none';document.body.appendChild(el)}el.textContent=message;el.style.display='block';clearTimeout(audioMessage.timer);audioMessage.timer=setTimeout(()=>el.style.display='none',6500)}
function speak(sentence){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){audioMessage('🔇 Voix non disponible dans ce navigateur. Essaie Chrome, Edge ou Safari.');return}
  const synth=window.speechSynthesis;
  try{
    synth.cancel();
    refreshVoices();
    const utterance=new SpeechSynthesisUtterance(String(sentence));
    audioUtterance=utterance; // garder une référence pour éviter certaines interruptions Chrome
    utterance.lang='en-US';utterance.rate=.82;utterance.pitch=1;utterance.volume=1;
    const voice=englishVoices.find(v=>/^en-US$/i.test(v.lang)&&/Google|Samantha|Natural|Microsoft/i.test(v.name))||englishVoices.find(v=>/^en-US$/i.test(v.lang))||englishVoices[0];
    if(voice)utterance.voice=voice;
    utterance.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')audioMessage('🔇 La lecture audio a échoué ('+e.error+'). Vérifie le son de ton appareil et les voix anglaises installées.')};
    synth.resume();
    synth.speak(utterance);
    // Certains navigateurs suspendent le moteur après une lecture précédente.
    setTimeout(()=>{if(audioUtterance===utterance&&synth.paused)synth.resume()},160);
  }catch(e){audioMessage('🔇 Impossible de lancer la lecture. Ouvre le site dans Chrome, Edge ou Safari.')}
}

function art(x,klass='art'){return `<div class="${klass}"><img src="${x.img}" alt="Scène de bande dessinée : ${esc(x.name)}" loading="lazy"><span class="name">${x.name.toUpperCase()}</span></div>`}
function chooseTab(v){tab=v;idx=0;turned=false;answered=false;answerVal='';mode=0;selectedMatch=null;matchDone=[];matchList=[];evalState=null;render()}
function render(){ $('tabs').innerHTML=TABS.map(([t,n])=>`<button type="button" class="${t===tab?'on':''}" data-tab="${t}">${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>chooseTab(el.dataset.tab));const list=active();if(tab==='home')return home();if(!list.length){$('app').innerHTML='<div class="empty">Aucune phrase sélectionnée. Retourne à l’accueil et coche les phrases à réviser.</div>';return}if(tab==='flash')flash(list);if(tab==='dict'||tab==='write'||tab==='translate')practice(list);if(tab==='match')matching(list);if(tab==='eval')evaluation(list)}
function home(){$('app').innerHTML=`<h2>📚 Les phrases du chapitre</h2><p class="hint">Clique sur 🔊 pour écouter une phrase entière en anglais. Coche les phrases que tu veux retrouver dans les activités.</p><div class="toolbar"><button class="btn" id="all">✓ Tout cocher</button><button class="btn coral" id="none">✕ Tout décocher</button><span class="count">${chosen.length} / ${DATA.length} sélectionnées</span></div><div class="tiles">${DATA.map(x=>`<article class="tile ${chosen.includes(x.id)?'':'off'}">${art(x)}<label class="selectBox"><input aria-label="Sélectionner la phrase ${x.id+1}" type="checkbox" data-check="${x.id}" ${chosen.includes(x.id)?'checked':''}></label><div class="text"><div class="tile-bottom"><div class="en">${esc(x.en)}</div><button type="button" class="audio" data-speak="${x.id}" aria-label="Écouter la phrase">🔊</button></div><div class="fr">${esc(x.fr)}</div></div></article>`).join('')}</div>`;$('all').onclick=()=>{chosen=DATA.map(x=>x.id);save('selected',chosen);render()};$('none').onclick=()=>{chosen=[];save('selected',chosen);render()};document.querySelectorAll('[data-check]').forEach(n=>n.onchange=e=>{let id=+n.dataset.check;chosen=e.target.checked?[...new Set([...chosen,id])]:chosen.filter(i=>i!==id);save('selected',chosen);render()});bindAudio()}
function bindAudio(){document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();speak(DATA[+b.dataset.speak].en)})}function toggleMode(m){mode=m;idx=0;turned=false;answered=false;answerVal='';selectedMatch=null;matchDone=[];matchList=[];render()}function modes(v,arr){return `<div class="options">${arr.map((a,i)=>`<button class="btn ${mode===i?'pill on':'light'}" data-mode="${i}">${a}</button>`).join('')}</div>`}function bindModes(){document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>toggleMode(+x.dataset.mode))}function navControls(n){return `<div class="actions" style="justify-content:center"><button class="btn light" id="prev">← Précédent</button><span class="progress">${idx+1} / ${n}</span><button class="btn coral" id="next">Suivant →</button></div>`}function navBind(n){$('prev').onclick=()=>{idx=(idx-1+n)%n;answered=false;turned=false;answerVal='';render()};$('next').onclick=()=>{idx=(idx+1)%n;answered=false;turned=false;answerVal='';render()}}
function flash(list){idx%=list.length;let x=list[idx];$('app').innerHTML=`<h2>🃏 Flashcards</h2><p class="hint">Clique sur la carte pour la retourner et découvrir la phrase anglaise.</p>${modes(mode,['🎨 Illustration → anglais','🇫🇷 Français → anglais'])}<div class="work"><div class="flip" id="flip" tabindex="0" role="button" aria-label="Retourner la carte">${turned?`<div class="prompt">${esc(x.en)}</div><button type="button" class="audio" data-speak="${x.id}" aria-label="Écouter">🔊</button>`:mode===0?art(x,'bigart'):`<div class="prompt">${esc(x.fr)}</div>`}<small>↻ Clique pour retourner</small></div>${navControls(list.length)}</div>`;bindModes();$('flip').onclick=()=>{turned=!turned;render()};$('flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();turned=!turned;render()}};bindAudio();navBind(list.length)}
function practice(list){idx%=list.length;let x=list[idx],isD=tab==='dict',isW=tab==='write',isT=tab==='translate';let title=isD?'🔊 Dictée':isW?'✏️ Écriture':'🌍 Traduction FR';let target=isT?x.fr:x.en;let opts=isW?modes(mode,['🇫🇷 Français → anglais','🎨 Image → anglais']):'';let cue=isD?`<p class="hint">Écoute attentivement et écris toute la phrase en anglais.</p><button type="button" class="btn" id="listen">🔊 Écouter la phrase</button>`:isT?`<div class="prompt">${esc(x.en)}</div><button type="button" class="btn light" id="listen">🔊 Écouter</button>`:mode===0?`<div class="prompt">${esc(x.fr)}</div>`:art(x,'bigart');$('app').innerHTML=`<h2>${title}</h2>${opts}<div class="work">${cue}<form id="answerForm"><label for="answer" class="hint">${isT?'Écris la traduction française :':'Écris la phrase entière en anglais :'}</label><input id="answer" class="input" autocomplete="off" spellcheck="false" placeholder="Ta réponse…" value="${esc(answerVal)}" ${answered?'disabled':''}><div class="actions" style="justify-content:center"><button class="btn" ${answered?'disabled':''} type="submit">✓ Vérifier</button><button class="btn gold" type="button" id="solution">Afficher la correction</button></div></form><div class="feedback ${answered?(good(answerVal,isT?[x.fr,...x.alt]:[x.en])?'good':'bad'):''}" aria-live="polite" id="feedback">${answered?good(answerVal,isT?[x.fr,...x.alt]:[x.en])?'✅ Bravo ! Bonne réponse !':`❌ Pas encore. Réponse attendue : ${esc(target)}`:'Vérifie ta réponse pour voir la correction.'}</div>${navControls(list.length)}</div>`;bindModes();$('answerForm').onsubmit=e=>{e.preventDefault();answerVal=$('answer').value;answered=true;render()};$('solution').onclick=()=>{$('feedback').className='feedback';$('feedback').textContent='💡 Correction : '+target};if($('listen'))$('listen').onclick=()=>speak(x.en);navBind(list.length)}
function initMatch(list){matchList=shuffle(list).map(x=>x.id);matchDone=[];selectedMatch=null}function matching(list){if(!matchList.length)initMatch(list);let remaining=matchList.filter(id=>!matchDone.includes(id));if(!remaining.length){$('app').innerHTML=`<h2>🎉 Bravo !</h2><p>Tu as associé les ${matchList.length} phrases !</p><button class="btn" id="restart">Recommencer</button>`;$('restart').onclick=()=>{initMatch(list);render()};return}let current=remaining.slice(0,5).map(id=>DATA[id]);if(!window.matchOrder||window.matchOrderKey!==current.map(x=>x.id).join('|')){window.matchOrder=shuffle(current.map(x=>x.id));window.matchOrderKey=current.map(x=>x.id).join('|')}let right=window.matchOrder.map(id=>DATA[id]);$('app').innerHTML=`<h2>🧩 Jeu d’appariement</h2><p class="hint">Clique sur une phrase anglaise, puis sur son image ou sa traduction. Les paires réussies disparaissent.</p>${modes(mode,['🎨 Anglais / image','🇫🇷 Anglais / français'])}<p class="progress">${matchDone.length} / ${matchList.length} paires réussies • ${current.length} affichées</p><div class="matchgrid"><div class="matchcol"><h3>🇬🇧 English</h3>${current.map(x=>`<button class="matchitem ${selectedMatch?.id===x.id?'selected':''}" data-left="${x.id}">${esc(x.en)}</button>`).join('')}</div><div class="matchcol"><h3>${mode===0?'🎨 Comics':'🇫🇷 Français'}</h3>${right.map(x=>`<button class="matchitem" data-right="${x.id}">${mode===0?`<img src="${x.img}" alt="${x.name}"><span class="name">${x.name.toUpperCase()}</span>`:esc(x.fr)}</button>`).join('')}</div></div><div id="matchfeedback" class="feedback">Choisis deux éléments qui vont ensemble.</div>`;bindModes();document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{selectedMatch={id:+b.dataset.left};document.querySelectorAll('[data-left]').forEach(a=>a.classList.toggle('selected',+a.dataset.left===selectedMatch.id))});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(!selectedMatch){$('matchfeedback').textContent="Sélectionne d'abord une phrase anglaise.";return}if(selectedMatch.id===+b.dataset.right){matchDone.push(selectedMatch.id);selectedMatch=null;render()}else{$('matchfeedback').className='feedback bad';$('matchfeedback').textContent='❌ Essaie encore !';selectedMatch=null;document.querySelectorAll('[data-left]').forEach(a=>a.classList.remove('selected'))}})}
const pseudoOK=s=>/^[0-9]{1,2}[A-Z]{1,2}[A-Z]{6}$/.test(s);function evalStart(list){const p=$('pseudo').value.trim().toUpperCase().replace(/\s/g,'');if(!pseudoOK(p)){$('pseudofeedback').textContent='Format attendu : classe + 3 lettres du NOM + 3 lettres du PRÉNOM (ex. 5BDURTOT).';return}evalState={pseudo:p,step:0,score:0,questions:Array.from({length:10},()=>({id:shuffle(list)[0].id,type:Math.floor(Math.random()*6)})),done:false,feedback:null,guess:null,matchLeft:null};render()}
function chooseAnswers(x,by){const set=shuffle(DATA.filter(y=>y.id!==x.id)).slice(0,3);return shuffle([x,...set]).map(y=>({id:y.id,label:by==='en'?y.en:y.fr}))}function evaluateCheck(guess){let e=evalState,q=e.questions[e.step],x=DATA[q.id],correct=q.type===2||q.type===3?good(guess,[x.en]):guess===x.id;e.feedback={correct,solution:q.type===0||q.type===2||q.type===3||q.type===4?x.en:x.fr};if(correct)e.score+=2;render()}
function evalNext(){let e=evalState;e.step++;e.feedback=null;e.guess=null;if(e.step===10){e.done=true;let b=getJSON('leader',[]);b.push({pseudo:e.pseudo,score:e.score,date:new Date().toLocaleDateString('fr-FR')});b.sort((a,c)=>c.score-a.score);save('leader',b.slice(0,100))}render()}
function evaluation(list){if(!evalState){$('app').innerHTML=`<h2>🏆 Évaluation d’entraînement</h2><p class="hint">10 questions aléatoires • feedback immédiat • score d'entraînement sur 20 et classement local. Aucune donnée n'est envoyée à l'enseignant.</p><div class="work evalbox"><label for="pseudo"><strong>Ton pseudo : CLASSE + 3 lettres du nom + 3 lettres du prénom</strong></label><p>Exemple pour Toto Durand en 5e B : <strong>5BDURTOT</strong></p><input id="pseudo" class="input" maxlength="12" placeholder="5BDURTOT"><p id="pseudofeedback" style="color:#b32947"></p><button id="start" class="btn">Commencer les 10 questions →</button></div>${leaderHTML()}`;$('start').onclick=()=>evalStart(list);return}let e=evalState;if(e.done){$('app').innerHTML=`<h2>🎉 Évaluation terminée !</h2><div class="work"><div class="score">${e.score} / 20</div><p>Bravo ${esc(e.pseudo)} ! Ton résultat est enregistré sur cet appareil.</p><button id="again" class="btn">Nouvelle évaluation</button></div>${leaderHTML()}`;$('again').onclick=()=>{evalState=null;render()};return}let q=e.questions[e.step],x=DATA[q.id],type=q.type;let titles=['Choisis la phrase correspondant au comic','Choisis la bonne traduction française','Écris la phrase en anglais','Écoute et écris la phrase en anglais','Associe la phrase au comic','Associe la phrase à sa traduction'];let choices=(type===0||type===4)?chooseAnswers(x,'en'):(type===1||type===5)?chooseAnswers(x,'fr'):[];if(e.choiceKey!==e.step){e.choices=choices;e.choiceKey=e.step}let html='';if(type===0)html=art(x,'bigart');if(type===1||type===5)html=`<div class="prompt">${esc(x.en)}</div>`;if(type===2)html=`<div class="prompt">${esc(x.fr)}</div>`;if(type===3)html=`<button type="button" class="btn" id="listen">🔊 Écouter la phrase</button>`;if(type===4)html=`<div class="prompt">${esc(x.en)}</div><div id="drop" class="drop">Dépose le comic ici (ou clique sur la bonne image)</div>`;if(type===2||type===3)html+=`<form id="evalForm"><input class="input" id="evalInput" placeholder="Écris toute la phrase" ${e.feedback?'disabled':''}><button class="btn" style="margin-top:12px" ${e.feedback?'disabled':''}>Vérifier</button></form>`;else html+=`<div class="choices">${e.choices.map(o=>`<button class="btn draggable" ${e.feedback?'disabled':''} data-choice="${o.id}" draggable="${type===4?'true':'false'}">${type===4?`<img src="${DATA[o.id].img}" alt="Comic" style="max-height:105px;max-width:100%;object-fit:contain"> <strong>${DATA[o.id].name}</strong>`:esc(o.label)}</button>`).join('')}</div>`;$('app').innerHTML=`<h2>🏆 Évaluation d’entraînement</h2><p class="progress">${esc(e.pseudo)} • Question ${e.step+1} / 10</p><div class="work evalbox"><h3>${titles[type]}</h3>${html}<div class="feedback ${e.feedback?(e.feedback.correct?'good':'bad'):''}">${e.feedback?(e.feedback.correct?'✅ Bravo !':'❌ À revoir.')+' Correction : '+esc(e.feedback.solution):'Réponds puis vérifie.'}</div>${e.feedback?'<button class="btn coral" id="evalNext">Question suivante →</button>':''}</div>`;if($('listen'))$('listen').onclick=()=>speak(x.en);if($('evalForm'))$('evalForm').onsubmit=evt=>{evt.preventDefault();evaluateCheck($('evalInput').value)};document.querySelectorAll('[data-choice]').forEach(b=>{b.onclick=()=>{if(!e.feedback)evaluateCheck(+b.dataset.choice)};if(type===4)b.ondragstart=evt=>evt.dataTransfer.setData('text/plain',b.dataset.choice)});if(type===4&&$('drop')){$('drop').ondragover=evt=>evt.preventDefault();$('drop').ondrop=evt=>{evt.preventDefault();if(!e.feedback)evaluateCheck(+evt.dataTransfer.getData('text/plain'))}}if($('evalNext'))$('evalNext').onclick=evalNext}
function leaderHTML(){let b=getJSON('leader',[]);return `<h3 style="margin-top:24px">🏅 Classement enregistré sur cet appareil</h3>${b.length?`<table class="leader"><thead><tr><th>Rang</th><th>Pseudo</th><th>Score</th><th>Date</th></tr></thead><tbody>${b.slice(0,20).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.pseudo)}</td><td>${x.score}/20</td><td>${esc(x.date)}</td></tr>`).join('')}</tbody></table>`:'<p class="hint">Aucun résultat enregistré pour le moment.</p>'}<p class="hint">⚠️ Ce classement est propre à ce navigateur. Il ne compare pas les élèves de différents appareils.</p>`}
function nextcloudDownload(url){if(!url||!url.includes('nuage.apps.education.fr'))return url;return url.replace(/\/+$/,'')+(url.replace(/\/+$/,'').endsWith('/download')?'':'/download')}
render();</script></body></html>
